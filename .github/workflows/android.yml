# Builds the Android app (APK) from the web game and publishes it as the "android-latest" release.
# The APK is signed with the test key in tools/android/ so each new build installs over the last one.
# That key is public: it is for test builds only, never for a Play Store release.
name: Android app
on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'assets/**', 'vendor/**', 'icons/**', 'index.html', 'tools/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Assemble the web game
        run: |
          mkdir -p build/www
          cp -r index.html css js assets vendor icons build/www/
      - name: Create the Android project (Capacitor)
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tide Tossers" com.raystub.tidetossers --web-dir www
          npx cap add android
          A=android/app/src/main
          cp ../tools/android/MainActivity.java $A/java/com/raystub/tidetossers/MainActivity.java
          # landscape only, vibration allowed
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' $A/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE" />\n    <application|' $A/AndroidManifest.xml
          # app icon: use the game's icon at every density
          rm -rf $A/res/mipmap-anydpi-v26
          for d in $A/res/mipmap-*; do cp ../icons/icon-192.png $d/ic_launcher.png; cp ../icons/icon-192.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
          # version: name from the game, code from the build number
          V=$(grep -o "TT.VERSION = '[^']*'" ../js/config.js | cut -d"'" -f2 | tr -d v)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${V}.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          mkdir -p ~/.android && cp ../tools/android/test.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: build/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk TideTossers.apk
          gh release delete android-latest --yes --cleanup-tag || true
          sleep 3
          gh release create android-latest TideTossers.apk --target ${{ github.sha }} --title "Tide Tossers for Android (test build ${{ github.run_number }})" \
            --notes "Install: download TideTossers.apk on your Android phone, open it, and allow installs from your browser or Files app when asked. Test build, not from the Play Store."
