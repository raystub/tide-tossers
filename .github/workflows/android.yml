# Builds the Android app (APK) from the web game and publishes it as the "android-latest" release.
# The APK is signed with the test key in tools/android/ so each new build installs over the last one.
# That key is public: it is for test builds only, never for a Play Store release.
name: Android app
on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'assets/**', 'vendor/**', 'icons/**', 'index.html', 'tools/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the test APK
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
        run: tools/android/build.sh test
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          sleep 3
          gh release create android-latest TideTossers.apk --target ${{ github.sha }} --title "Tide Tossers for Android (test build ${{ github.run_number }})" \
            --notes "Install: download TideTossers.apk on your Android phone, open it, and allow installs from your browser or Files app when asked. Test build, not from the Play Store."
